[project]
name = "wechat-helper"
version = "0.1.0"
description = "微信助手：UI 自动化读取聊天消息（监听新消息 + 历史滚动抓取），落地本地 SQLite"
requires-python = ">=3.10"
dependencies = [
    "wx4py>=0.1.0",
    "mcp>=1.2.0",
]

[project.scripts]
wx = "wechat_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_helper"]
